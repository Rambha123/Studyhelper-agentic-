[project]
name = "studyhelper"
version = "0.1.0"
description = "RAG-based study helper with tool calling, structured output and a Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "streamlit>=1.35.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyhelper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
