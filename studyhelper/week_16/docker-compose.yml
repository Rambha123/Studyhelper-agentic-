services:
  backend:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    volumes:
      - chroma:/app/chroma_db
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      retries: 5

  ui:
    build: .
    command: ["uv", "run", "streamlit", "run", "src/studyhelper/ui.py",
              "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    environment:
      - API_BASE=http://backend:8080
    depends_on: [backend]
    restart: unless-stopped

  # Optional: local open-source model via vLLM. Needs an NVIDIA GPU, so it is off by default.
  # Enable with: docker compose --profile gpu up   and set LLM_BASE_URL=http://vllm:8000/v1
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    command: --model Qwen/Qwen2.5-1.5B-Instruct --max-model-len 4096
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  chroma:
